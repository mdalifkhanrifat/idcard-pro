name: idcard-pro

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: idcard-pro-php:dev
  volumes:
    - .:/var/www/html
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  extra_hosts:
    - host.docker.internal:host-gateway
  networks: [default, pdf]
  restart: unless-stopped

services:
  app:
    <<: *php

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [default, pdf]
    restart: unless-stopped

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600

  scheduler:
    <<: *php
    command: php artisan schedule:work

  vite:
    image: node:24-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
    profiles: [dev]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/app.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Server-side PDFs (config/pdf.php): Chromium that may only open this app (the web service), no
  # public internet, no webhooks or downloads, and no port published outside the compose network.
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --chromium-allow-list=^http://web(/|$$)
      - --chromium-deny-public-ips
      - --webhook-disable
      - --api-disable-download-from
      - --libreoffice-disable-routes
      - --api-timeout=60s
      - --log-level=warn
    # Only on the internal network: no route to the internet at all
    networks: [pdf]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

networks:
  # Internal only (no internet): the PDF engine, the app that calls it and the web server it opens
  pdf:
    internal: true

volumes:
  mysql-data:
  redis-data:
