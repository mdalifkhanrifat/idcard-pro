server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 25M;

    # Re-resolve the php-fpm container on every request so restarts that change its IP don't cause 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded files (photos, signatures, biometrics) are never executable.
    location ~* ^/storage/.*\.(php|phtml|phar)$ { deny all; }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }
}
